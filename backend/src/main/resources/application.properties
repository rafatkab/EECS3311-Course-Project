spring.application.name=backend
server.port=${BACKEND_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.config.import=optional:file:./config.local.properties
spring.datasource.url=${STUDY_DB_URL:jdbc:h2:file:./data/study-planner}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=5
study.auth.username=${STUDY_USERNAME:student}
study.auth.password=${STUDY_PASSWORD:}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=101MB
study.ai.base-url=${LLM_BASE_URL:http://localhost:11434/v1}
study.ai.model=${LLM_MODEL:}
study.ai.api-key=${LLM_API_KEY:}
study.ai.token-limit-field=${LLM_TOKEN_LIMIT_FIELD:max_tokens}
study.ai.timeout-seconds=45
study.ai.max-output-tokens=1500
