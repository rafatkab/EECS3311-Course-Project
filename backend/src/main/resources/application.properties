spring.application.name=backend
server.port=${BACKEND_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.config.import=optional:file:./config.local.properties
spring.datasource.url=${STUDY_DB_URL:jdbc:h2:file:./data/study-planner}
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=5
study.auth.username=${STUDY_USERNAME:student}
study.auth.password=${STUDY_PASSWORD:}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
